<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">DB</span>
      <div>
        <p class="brand-name">DidiBot</p>
        <p class="brand-sub">Admin</p>
      </div>
    </div>

    <nav>
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
      }
    </nav>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
