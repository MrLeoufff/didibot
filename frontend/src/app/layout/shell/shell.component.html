<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="/didibot.png" width="48" height="48" alt="" />
      <div>
        <p class="brand-name">DidiBot</p>
        <p class="brand-sub">{{ tagline }}</p>
      </div>
    </div>

    <nav>
      @for (item of nav(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">
          {{ item.label }}
          @if (item.badge > 0) {
            <span class="nav-badge">{{ item.badge }}</span>
          }
        </a>
      }
    </nav>

    <div class="sidebar-foot">
      <p class="muted user">{{ auth.username() }}</p>
      <button type="button" class="btn ghost" (click)="logout()">Sortir du QG</button>
      <a class="muted-link" routerLink="/propose">Lancer une punchline</a>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
