<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">DB</span>
      <div>
        <p class="brand-name">DidiBot</p>
        <p class="brand-sub">Admin</p>
      </div>
    </div>

    <nav>
      @for (item of nav(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">
          {{ item.label }}
          @if (item.badge > 0) {
            <span class="nav-badge">{{ item.badge }}</span>
          }
        </a>
      }
    </nav>

    <div class="sidebar-foot">
      <p class="muted">{{ auth.username() }}</p>
      <button type="button" class="btn ghost" (click)="logout()">Déconnexion</button>
      <a class="muted-link" routerLink="/propose">Page proposition</a>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
