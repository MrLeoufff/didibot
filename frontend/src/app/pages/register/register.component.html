<div class="register-page">
  <form class="panel form" [formGroup]="form" (ngSubmit)="submit()">
    <img class="mascot" src="/didibot.png" width="72" height="72" alt="DidiBot" />
    <p class="eyebrow">Recrutement</p>
    <h1>Rejoindre la team troll</h1>
    <p class="muted">Un admin validera. DidiBot, lui, t’a déjà jugé.</p>

    @if (error()) {
      <p class="banner error">{{ error() }}</p>
    }
    @if (success()) {
      <p class="banner ok">{{ success() }}</p>
    }

    <label>
      Pseudo
      <input formControlName="username" autocomplete="username" placeholder="genre Chuck Norris" />
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    <label>
      Encore une fois, pour la JVM
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>

    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Dossier en cours…' : 'Postuler au QG' }}
    </button>

    <a class="link" routerLink="/login">Déjà dedans ? Connexion</a>
  </form>
</div>
