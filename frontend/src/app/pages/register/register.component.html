<div class="register-page">
  <form class="panel form" [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">DidiBot</p>
    <h1>Créer un compte</h1>
    <p class="muted">Ta demande restera en attente jusqu’à acceptation par un admin.</p>

    @if (error()) {
      <p class="banner error">{{ error() }}</p>
    }
    @if (success()) {
      <p class="banner ok">{{ success() }}</p>
    }

    <label>
      Pseudo
      <input formControlName="username" autocomplete="username" />
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    <label>
      Confirmer le mot de passe
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>

    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Envoi…' : 'Demander un compte' }}
    </button>

    <a class="link" routerLink="/login">Déjà un compte ? Se connecter</a>
  </form>
</div>
