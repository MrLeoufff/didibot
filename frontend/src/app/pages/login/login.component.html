<div class="login-page">
  <form class="panel form" [formGroup]="form" (ngSubmit)="submit()">
    <img class="mascot" src="/didibot.png" width="72" height="72" alt="DidiBot" />
    <p class="eyebrow">QG du troll</p>
    <h1>On t’attendait.</h1>
    <p class="muted">Java &gt; C#. Les comptes non validés, encore plus bas.</p>

    @if (error()) {
      <p class="banner error">{{ error() }}</p>
    }

    <label>
      Pseudo
      <input formControlName="username" autocomplete="username" placeholder="Lead Tech en herbe" />
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'La JVM démarre…' : 'Entrer dans le QG' }}
    </button>

    <a class="link" routerLink="/register">Demander un badge troll</a>
    <a class="link" routerLink="/propose">Proposer une punchline sans compte</a>
  </form>
</div>
