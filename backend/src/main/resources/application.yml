spring:
  application:
    name: discord-bot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/discord_bot}
    username: ${SPRING_DATASOURCE_USERNAME:discord}
    password: ${SPRING_DATASOURCE_PASSWORD:discord_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

discord:
  token: ${DISCORD_TOKEN:}
  enabled: ${DISCORD_ENABLED:true}
  rare-event-chance: ${DISCORD_RARE_EVENT_CHANCE:0.01}
  avatar-image-chance: ${DISCORD_AVATAR_IMAGE_CHANCE:0.12}
  update-avatar-on-startup: ${DISCORD_UPDATE_AVATAR_ON_STARTUP:true}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:changeme}
  jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-32chars-min}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    fr.dwg.discordbot: INFO
    net.dv8tion.jda: WARN

---
spring:
  config:
    activate:
      on-profile: docker

logging:
  level:
    fr.dwg.discordbot: INFO
